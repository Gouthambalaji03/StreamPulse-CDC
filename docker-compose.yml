version: '3.8'

services:
  # 1. PostgreSQL 16 with Logical WAL Replication enabled
  postgres:
    image: postgres:16-alpine
    container_name: cdc-postgres
    environment:
      POSTGRES_USER: cdc_user
      POSTGRES_PASSWORD: cdc_password
      POSTGRES_DB: app_database
    command:
      - "postgres"
      - "-c"
      - "wal_level=logical"
      - "-c"
      - "max_wal_senders=10"
      - "-c"
      - "max_replication_slots=10"
    ports:
      - "5432:5432"
    volumes:
      - ./init-scripts/init-cdc.sql:/docker-entrypoint-initdb.d/init-cdc.sql
      - postgres_data:/var/lib/postgresql/data
    networks:
      - cdc-network

  # 2. Apache Kafka & Zookeeper (Message Broker / Event Stream Bus)
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: cdc-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - cdc-network

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: cdc-kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: 'zookeeper:2181'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'
    networks:
      - cdc-network

  # 3. Elasticsearch (Search Index Target Sink)
  elasticsearch:
    image: elasticsearch:8.13.0
    container_name: cdc-elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    volumes:
      - es_data:/usr/share/elasticsearch/data
    networks:
      - cdc-network

  # 4. MongoDB (Analytics & Data Lake Target Sink)
  mongodb:
    image: mongo:7.0
    container_name: cdc-mongodb
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: mongo_admin
      MONGO_INITDB_ROOT_PASSWORD: mongo_password
    volumes:
      - mongo_data:/data/db
    networks:
      - cdc-network

  # 5. CDC Stream Engine & Real-Time Dashboard (FastAPI Backend + UI)
  cdc-platform:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cdc-platform-app
    depends_on:
      - postgres
      - kafka
      - elasticsearch
      - mongodb
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://cdc_user:cdc_password@postgres:5432/app_database
      - KAFKA_BOOTSTRAP_SERVERS=kafka:29092
      - ELASTICSEARCH_URL=http://elasticsearch:9200
      - MONGO_URL=mongodb://mongo_admin:mongo_password@mongodb:27017
    networks:
      - cdc-network

networks:
  cdc-network:
    driver: bridge

volumes:
  postgres_data:
  es_data:
  mongo_data:
